global:
  scrape_interval: 5s
  scrape_timeout: 3s
  evaluation_interval: 15s
  external_labels:
    grafana_url: ${GRAFANA_PUBLIC_URL}
    cluster: ${LAVIK_CLUSTER}
scrape_configs:
  - job_name: lavik
    metrics_path: /metrics
    scheme: http
    file_sd_configs:
      - files:
          - targets/lavik.json
        refresh_interval: 30s
  - job_name: lavik-meta
    metrics_path: /metrics
    scheme: http
    file_sd_configs:
      - files:
          - targets/lavik-meta.json
        refresh_interval: 30s
rule_files:
  - rules/*.yml
alerting:
  alertmanagers:
    - file_sd_configs:
        - files:
            - targets/alertmanagers.json
          refresh_interval: 30s
