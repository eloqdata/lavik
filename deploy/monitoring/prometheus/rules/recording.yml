groups:
  - name: lavik.recording
    rules:
      - record: lavik:ready
        expr: (lavik_server_ready{job="lavik"} == 1) and on (cluster, job, instance) (up{job="lavik"} == 1)
      - record: lavik:worker_admission_ratio
        expr:
          (lavik_worker_retained_memory_bytes{job="lavik"} + lavik_worker_memory_admission_pending_bytes{job="lavik"}
          + lavik_worker_fullsync_reserved_memory_bytes{job="lavik"}) / (lavik_worker_memory_limit_bytes{job="lavik"}
          > 0)
      - record: lavik:writable_space_ratio
        expr: lavik_storage_available_bytes{job="lavik"} / (lavik_storage_capacity_bytes{job="lavik"} > 0)
      - record: lavik:publisher_queue_ratio
        expr:
          lavik_replication_publish_queue_bytes{job="lavik"} / (lavik_replication_publish_queue_capacity_bytes{job="lavik"}
          > 0)
      - record: lavik:fullsync_queue_ratio
        expr:
          (lavik_fullsync_publish_queue_bytes{job="lavik"} + lavik_fullsync_publish_queue_admitted_bytes{job="lavik"})
          / (lavik_fullsync_publish_queue_capacity_bytes{job="lavik"} > 0)
