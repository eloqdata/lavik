rule_files:
  - ../rules/recording.yml
  - ../rules/alerts.yml
evaluation_interval: 15s
tests:
  - name: pending apply fires warning then critical and resolves
    interval: 1m
    input_series:
      - series: up{job="lavik",cluster="test",instance="data:9100"}
        values: 1x30
      - series: lavik_server_ready{job="lavik",cluster="test",instance="data:9100"}
        values: 1x30
      - series: lavik_replication_observation_available{job="lavik",cluster="test",instance="data:9100"}
        values: 1x30
      - series: lavik_replication_pending_work{job="lavik",cluster="test",instance="data:9100",side="target",worker="0",flow="0",step="apply"}
        values: 1x10 0x20
      - series: lavik_replication_no_progress_seconds{job="lavik",cluster="test",instance="data:9100",side="target",worker="0",flow="0",step="apply"}
        values: 0+60x10 0x20
      - series: lavik_replication_native_flow_connections{job="lavik",cluster="test",instance="data:9100",side="target",worker="0",flow="0"}
        values: 1x30
    promql_expr_test:
      - expr: count(ALERTS{alertstate="firing",alertname="LavikReplicationStalled"}) or vector(0)
        eval_time: 4m
        exp_samples:
          - labels: "{}"
            value: 0
      - expr: count(ALERTS{alertstate="firing",alertname="LavikReplicationStalled",severity="warning"}) or vector(0)
        eval_time: 5m30s
        exp_samples:
          - labels: "{}"
            value: 1
      - expr: count(ALERTS{alertstate="firing",alertname="LavikReplicationStalled",severity="critical"}) or vector(0)
        eval_time: 8m30s
        exp_samples:
          - labels: "{}"
            value: 1
      - expr: count(ALERTS{alertstate="firing",alertname="LavikReplicationStalled"}) or vector(0)
        eval_time: 14m
        exp_samples:
          - labels: "{}"
            value: 0
