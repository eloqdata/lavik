    promql_expr_test:
      - expr: count(ALERTS{alertstate="firing",alertname="LavikFullSyncFailures"}) or vector(0)
        eval_time: 10m
        exp_samples:
          - labels: "{}"
            value: 1
      - expr: count(ALERTS{alertstate="firing",alertname="LavikFullSyncFailures"}) or vector(0)
        eval_time: 30m
        exp_samples:
          - labels: "{}"
            value: 0
