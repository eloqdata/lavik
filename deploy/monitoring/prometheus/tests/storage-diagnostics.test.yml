rule_files:
  - ../rules/recording.yml
  - ../rules/alerts.yml
evaluation_interval: 15s
group_eval_order:
  - lavik.recording
  - lavik.alerts
tests:
  - name: backlog needs full window and for, then recovers
    interval: 15s
    input_series:
      - &server_ready
        series: lavik_server_ready{job="lavik",cluster="test",instance="data:9100",lavik_mode="standalone"}
        values: 1x160
      - &memory_rejected_commands_total
        series: lavik_memory_rejected_commands_total{job="lavik",cluster="test",instance="data:9100",lavik_mode="standalone"}
        values: "0x160"
      - &worker_retained_memory_bytes
        series: lavik_worker_retained_memory_bytes{worker="0",job="lavik",cluster="test",instance="data:9100",lavik_mode="standalone"}
        values: 10x160
      - &worker_memory_admission_pending_bytes
        series: lavik_worker_memory_admission_pending_bytes{worker="0",job="lavik",cluster="test",instance="data:9100",lavik_mode="standalone"}
        values: "0x160"
      - &worker_fullsync_reserved_memory_bytes
        series: lavik_worker_fullsync_reserved_memory_bytes{worker="0",job="lavik",cluster="test",instance="data:9100",lavik_mode="standalone"}
        values: "0x160"
      - &worker_memory_limit_bytes
        series: lavik_worker_memory_limit_bytes{worker="0",job="lavik",cluster="test",instance="data:9100",lavik_mode="standalone"}
        values: 100x160
      - &capacity_bytes
        series: lavik_storage_capacity_bytes{device="0",path="/data",job="lavik",cluster="test",instance="data:9100",lavik_mode="standalone"}
        values: 100x160
      - &available_bytes
        series: lavik_storage_available_bytes{device="0",path="/data",job="lavik",cluster="test",instance="data:9100",lavik_mode="standalone"}
        values: 50x160
      - &replication_backlog_active
        series: lavik_replication_backlog_active{worker="0",job="lavik",cluster="test",instance="data:9100",lavik_mode="standalone"}
        values: "0x160"
      - &replication_backlog_pinned_cursors
        series: lavik_replication_backlog_pinned_cursors{worker="0",job="lavik",cluster="test",instance="data:9100",lavik_mode="standalone"}
        values: "0x160"
      - &replication_backlog_backpressured
        series: lavik_replication_backlog_backpressured{worker="0",job="lavik",cluster="test",instance="data:9100",lavik_mode="standalone"}
        values: "0x160"
      - &replication_publish_queue_bytes
