        values: 100x160
      - &fullsync_publish_queue_bytes
        series: lavik_fullsync_publish_queue_bytes{worker="0",job="lavik",cluster="test",instance="data:9100",lavik_mode="standalone"}
        values: "0x160"
      - &fullsync_publish_queue_admitted_bytes
        series: lavik_fullsync_publish_queue_admitted_bytes{worker="0",job="lavik",cluster="test",instance="data:9100",lavik_mode="standalone"}
        values: "0x160"
      - &fullsync_publish_queue_capacity_bytes
