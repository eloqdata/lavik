        values: "0x160"
      - &tx_commit_batch_transactions_total
        series: lavik_storage_tx_commit_batch_transactions_total{job="lavik",cluster="test",instance="data:9100",lavik_mode="standalone"}
        values: "0x160"
      - &tx_commit_input_fences_total
        series: lavik_storage_tx_commit_input_fences_total{job="lavik",cluster="test",instance="data:9100",lavik_mode="standalone"}
        values: "0x160"
      - &tx_commit_merged_fences_total
        series: lavik_storage_tx_commit_merged_fences_total{job="lavik",cluster="test",instance="data:9100",lavik_mode="standalone"}
        values: "0x160"
      - &tx_commit_backpressure_waits_total
        series: lavik_storage_tx_commit_backpressure_waits_total{job="lavik",cluster="test",instance="data:9100",lavik_mode="standalone"}
        values: "0x160"
      - &tx_commit_queue_depth
        series: lavik_storage_tx_commit_queue_depth{job="lavik",cluster="test",instance="data:9100",lavik_mode="standalone"}
        values: "0x160"
      - &tx_commit_queue_peak
        series: lavik_storage_tx_commit_queue_peak{job="lavik",cluster="test",instance="data:9100",lavik_mode="standalone"}
        values: "0x160"
      - &tx_commit_queue_high_watermark
        series: lavik_storage_tx_commit_queue_high_watermark{job="lavik",cluster="test",instance="data:9100",lavik_mode="standalone"}
        values: 4096x160
      - &dirty_staging_bytes
        series: lavik_storage_dirty_staging_bytes{job="lavik",cluster="test",instance="data:9100",lavik_mode="standalone"}
        values: "0x160"
      - &flushes_pending
        series: lavik_storage_flushes_pending{job="lavik",cluster="test",instance="data:9100",lavik_mode="standalone"}
        values: "0x160"
      - &tx_commits_pending
        series: lavik_storage_tx_commits_pending{job="lavik",cluster="test",instance="data:9100",lavik_mode="standalone"}
        values: "0x160"
      - &durability_pending
        series: lavik_storage_durability_pending{job="lavik",cluster="test",instance="data:9100",lavik_mode="standalone"}
        values: "0x160"
      - &expiration_pause_count
        series: lavik_storage_expiration_pause_count{job="lavik",cluster="test",instance="data:9100",lavik_mode="standalone"}
        values: "0x160"
      - &io_operations_total_write
        series: lavik_storage_io_operations_total{operation="write",job="lavik",cluster="test",instance="data:9100",lavik_mode="standalone"}
        values: "0x160"
      - &io_operations_total_fdatasync
        series: lavik_storage_io_operations_total{operation="fdatasync",job="lavik",cluster="test",instance="data:9100",lavik_mode="standalone"}
        values: "0x160"
      - &up
        series: up{job="lavik",cluster="test",instance="data:9100",lavik_mode="standalone"}
        values: 1x160
    promql_expr_test:
      - expr: count(ALERTS{alertname="LavikTxBacklogNotDraining",alertstate="firing"}) or vector(0)
        eval_time: 14m45s
        exp_samples:
          - labels: "{}"
            value: 0
      - expr: count(ALERTS{alertname="LavikTxBacklogNotDraining",alertstate="firing"}) or vector(0)
        eval_time: 15m
        exp_samples:
          - labels: "{}"
            value: 1
      - expr: count(ALERTS{alertname="LavikTxBacklogNotDraining",alertstate="firing"}) or vector(0)
        eval_time: 18m30s
        exp_samples:
          - labels: "{}"
            value: 0
