repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.1
    hooks:
      - id: clang-format
        name: clang-format 23.1.1
        files: '^(app/|include/lavik/|src/|tests/).*\.(c|cc|cpp|cxx|h|hh|hpp|hxx)$'
        exclude: '^include/lavik/CLI11\.hpp$'
