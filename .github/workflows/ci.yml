# Temporary issue #131 diagnostics; no product or test changes.
name: Issue 131 ARM64 diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download unchanged CI runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ci-build-arm64
          run-id: 37284811797
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/ci-build
      - name: Prepare isolated test host
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd
          sudo sysctl -w kernel.io_uring_disabled=0
          sudo install -d -o "$(id -u)" -g "$(id -g)" /mnt/dev/i131-diagnostics
          tar --zstd -xf "$RUNNER_TEMP/ci-build/ci-build.tar.zst" build_ci/lavik build_ci/lavik_grouped_ordered_write_e2e_test build_ci/ci-build-bundle.json
          cat build_ci/ci-build-bundle.json
          uname -a
          lscpu
          sha256sum build_ci/lavik build_ci/lavik_grouped_ordered_write_e2e_test
      - name: Observe isolated case and original suite
        env:
          LAVIK_TEST_DATA_DIR: /mnt/dev/i131-diagnostics
        run: |
          sudo prlimit --pid "$$" --memlock=unlimited
          python3 - <<'PYCODE'
          #!/usr/bin/env python3
          """Task-local observation of synthetic full-disk regression fixtures."""
          from pathlib import Path
          import json
          import os
          import signal
          import socket
          import subprocess
          import threading
          import time

          root = Path.cwd()
          results = root / 'diagnostics'
          results.mkdir(exist_ok=True)
          server = str(root / 'build_ci/lavik')
          test = str(root / 'build_ci/lavik_grouped_ordered_write_e2e_test')
          seen = {}
          stop = threading.Event()


          def info(port):
              with socket.create_connection(('127.0.0.1', port), timeout=0.5) as connection:
                  connection.settimeout(0.5)
                  connection.sendall(b'*1\r\n$4\r\nINFO\r\n')
                  with connection.makefile('rb') as reader:
                      head = reader.readline()
                      if not head.startswith(b'$'):
                          return repr(head)
                      size = int(head[1:-2])
                      if size < 0 or size > 1048576:
                          return f'unexpected INFO length {size}'
                      return reader.read(size).decode(errors='replace')


          def observe():
              with (results / 'process-state.jsonl').open('w') as out:
                  while not stop.wait(1):
                      for proc in Path('/proc').glob('[0-9]*'):
                          try:
                              args = proc.joinpath('cmdline').read_bytes().split(b'\0')
                              if args[0].decode() != server:
                                  continue
                              args = [a.decode() for a in args if a]
                              started = seen.setdefault(proc.name, time.monotonic())
                              row = {'time': time.time(), 'pid': int(proc.name),
                                     'age': time.monotonic() - started,
                                     'port': int(args[args.index('--port') + 1]),
                                     'disk': args[args.index('--data-file') + 1],
                                     'threads': []}
                              for task in proc.joinpath('task').iterdir():
                                  row['threads'].append({'tid': task.name,
                                      'stat': task.joinpath('stat').read_text(),
                                      'wchan': task.joinpath('wchan').read_text()})
                              # Let ordinary setup finish before issuing diagnostic reads.
                              if row['age'] > 5:
                                  try:
                                      row['info'] = info(row['port'])
                                  except (OSError, ValueError) as error:
                                      row['info_error'] = str(error)
                              out.write(json.dumps(row) + '\n')
                              out.flush()
                          except (OSError, ValueError, IndexError):
                              continue


          thread = threading.Thread(target=observe, daemon=True)
          thread.start()
          steps = [
              ('isolated', ['--gtest_filter=AllTypes/GroupedFullDiskExpirationE2e.ReclaimsGraphAndRecovers/ListIndirect', '--gtest_repeat=5']),
              ('original-suite', [])]
          exit_code = 0
          try:
              for name, flags in steps:
                  with (results / f'{name}.log').open('w') as out:
                      process = subprocess.Popen([test, server, *flags], stdout=out,
                                                 stderr=subprocess.STDOUT, start_new_session=True)
                      try:
                          result = process.wait(timeout=1000)
                      except subprocess.TimeoutExpired:
                          os.killpg(process.pid, signal.SIGKILL)
                          process.wait()
                          result = 124
                  print(f'{name}: exit={result}', flush=True)
                  print((results / f'{name}.log').read_text()[-12000:], flush=True)
                  if result:
                      exit_code = result
                      break
          finally:
              stop.set()
              thread.join(timeout=5)
          raise SystemExit(exit_code)
          PYCODE
      - name: Retain diagnostics and synthetic failing media
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: i131-arm64-full-disk-diagnostics
          path: |
            diagnostics/
            /mnt/dev/i131-diagnostics/
          retention-days: 7
