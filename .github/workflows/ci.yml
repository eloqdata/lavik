name: CI

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  reproduce-gc-retirement:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ci-build-amd64
          run-id: 39758725666
          github-token: ${{ github.token }}
          path: /tmp/lavik-ci-runtime
      - name: Restore exact failed-run binaries
        run: |
          tar --zstd -xf /tmp/lavik-ci-runtime/ci-build.tar.zst
          sudo sysctl -w kernel.io_uring_disabled=0
          sudo install -d -o "$(id -u)" -g "$(id -g)" /mnt/dev
          mkdir -p build_ci/repro
      - name: Repeat original crash recovery test
        env:
          LAVIK_TEST_DATA_DIR: /mnt/dev
        run: |
          set -o pipefail
          ulimit -c 0
          sudo prlimit --pid "$$" --memlock=unlimited
          build_ci/lavik_list_e2e_test "$PWD/build_ci/lavik" \
            --gtest_filter=LargeHashDurabilityE2eTest.GcSourceRetirementCrashPreservesExtentHash \
            --gtest_repeat=20 --gtest_break_on_failure \
            2>&1 | tee build_ci/repro/original-repeat.log
      - name: Capture delete and GC progress
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          sudo prlimit --pid "$$" --memlock=unlimited
          python3 scripts/diagnose_gc_retirement.py "$PWD/build_ci/lavik" \
            --repeat 40 2>&1 | tee build_ci/repro/probe.log
      - name: Upload diagnostic logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: gc-retirement-diagnostics
          path: |
            build_ci/repro/
            /tmp/lavik-gc-probe-*/*.json
            /tmp/lavik-gc-probe-*/*.log
          retention-days: 7
