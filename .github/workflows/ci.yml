name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pre-commit
        run: python -m pip install pre-commit
      # The hook owns the exact clang-format version for both local and CI use.
      - name: Check all maintained sources
        run: pre-commit run clang-format --all-files --show-diff-on-failure

  # Separate job IDs keep dependency results local to each architecture.
  # Singleton platform matrices let both architectures share the same steps.
  admin-amd64:
    name: Admin tests (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
    steps: &admin-steps
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          # Match the runtime bundled by scripts/package_admin.sh.
          node-version: '24.15.0'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run Admin JavaScript tests
        run: node --test admin/test/*.test.mjs
      - name: Run remote ownership and teardown tests
        run: python3 admin/test/remote_test.py

  admin-arm64:
    name: Admin tests (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps: *admin-steps

  build-amd64:
    name: Build tests (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
    env: &build-env
      PYTHONPATH: ${{ github.workspace }}/build_ci/test_tools/redis_py
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 1G
    steps: &build-steps
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: raft/go.mod
          cache-dependency-path: |
            raft/go.sum
            tests/meta_integration/cluster_client_go/go.sum
            tests/meta_integration/sentinel_client_go/go.sum
      - name: Restore compiler cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .ccache
          key: ci-clang18-debug-v1-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: ci-clang18-debug-v1-${{ matrix.arch }}-
      - name: Initialize runtime dependencies
        # Public gitlinks are identical to the tested commit, including fork PRs.
        run: |
          git submodule update --init --depth 1 bycorf third_party/mimalloc
          git -C bycorf submodule update --init --depth 1 third_party/abseil third_party/liburing
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang-18 cmake ninja-build ccache libssl-dev openssl \
            python3 python3-venv curl tcl zstd
      - name: Check CI runner and bundle regressions
        run: python3 -m unittest discover -s tests -p 'test_ci_*.py'
      - name: Check Go formatting
        run: test -z "$(gofmt -l raft tests/meta_integration/cluster_client_go tests/meta_integration/sentinel_client_go)"
      - name: Install Redis integration peers
        # CTest embeds absolute paths. Package peers under the shared workspace
        # path instead of RUNNER_TEMP so every shard uses these exact versions.
        run: |
          ./scripts/install_test_redis.sh "$GITHUB_WORKSPACE/build_ci/test_tools/redis"
          ./scripts/install_test_redisshake.sh "$GITHUB_WORKSPACE/build_ci/test_tools/redis-shake"
          ./scripts/install_test_redis_py.sh "$GITHUB_WORKSPACE/build_ci/test_tools/redis_py"
          echo "$GITHUB_WORKSPACE/build_ci/test_tools/redis" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/build_ci/test_tools/redis-shake" >> "$GITHUB_PATH"
      - name: Configure
        # Retain Debug assertions and both Meta and Data fault hooks.
        run: |
          cmake -S . -B build_ci -G Ninja \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Debug \
            -DLAVIK_ENABLE_OPT=OFF \
            -DLAVIK_ENABLE_TEST_FAULTS=ON \
            -DPython3_EXECUTABLE=/usr/bin/python3 \
            -DLAVIK_PYTHON3_EXECUTABLE=/usr/bin/python3 \
            -DLAVIK_CLUSTER_CLIENT_REDIS_PY="$GITHUB_WORKSPACE/build_ci/test_tools/redis_py" \
            -DBUILD_TESTING=ON
      - name: Build all targets once
        run: |
          cmake --build build_ci --parallel "$(nproc)"
          ccache --show-stats
      - name: Package test runtime
        run: python3 scripts/ci_build_bundle.py create build_ci "$RUNNER_TEMP/ci-build.tar.zst"
      - name: Upload test runtime
        uses: actions/upload-artifact@v7
        with:
          name: ci-build-${{ matrix.arch }}
          path: ${{ runner.temp }}/ci-build.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  build-arm64:
    name: Build tests (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
    env: *build-env
    steps: *build-steps

  test-shard-amd64:
    name: Test shard (${{ matrix.platform.arch }}, ${{ matrix.shard }})
    needs: build-amd64
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform:
          - arch: amd64
            runner: ubuntu-24.04
        shard: [0, 1, 2, 3, 4, 5]
    env: &shard-env
      PYTHONPATH: ${{ github.workspace }}/build_ci/test_tools/redis_py
    steps: &shard-steps
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # meta_raft.go still exercises go test -race with the pinned toolchain.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: raft/go.mod
          cache-dependency-path: |
            raft/go.sum
            tests/meta_integration/cluster_client_go/go.sum
            tests/meta_integration/sentinel_client_go/go.sum
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang-18 cmake openssl python3 tcl zstd
      - name: Download test runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-build-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/ci-build
      - name: Restore and verify test runtime
        run: |
          tar --zstd -xf "$RUNNER_TEMP/ci-build/ci-build.tar.zst"
          python3 scripts/ci_build_bundle.py validate build_ci
          echo "$GITHUB_WORKSPACE/build_ci/test_tools/redis" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/build_ci/test_tools/redis-shake" >> "$GITHUB_PATH"
      - name: Prepare test host
        run: |
          sudo sysctl -w kernel.io_uring_disabled=0
          sudo install -d -o "$(id -u)" -g "$(id -g)" /mnt/dev
      - name: Run software test shard
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          sudo prlimit --pid "$$" --memlock=unlimited
          # Each shard has an isolated VM and remains serial internally, so
          # fixed ports, large fixtures, and timing-sensitive faults cannot race.
          scratch_image=$(mktemp "$RUNNER_TEMP/lavik-ci-gate.XXXXXX")
          scratch_device=
          cleanup() {
            if [[ -n "$scratch_device" ]]; then
              sudo losetup --detach "$scratch_device"
            fi
            rm -f -- "$scratch_image"
          }
          trap cleanup EXIT
          truncate -s 16M "$scratch_image"
          scratch_device=$(sudo losetup --find --show "$scratch_image")
          export LAVIK_CLUSTER_HARDWARE_OPT_IN=1
          export LAVIK_CLUSTER_SCRATCH_DEVICE="$scratch_device"
          # Finish before the 90-minute job limit so failed/hung shards can
          # still upload their last test output instead of losing all logs.
          timeout --kill-after=30s 80m ./scripts/run_ci_tests.sh build_ci \
            --shard-index "$SHARD_INDEX" --shard-count 6
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.platform.arch }}-${{ matrix.shard }}
          path: |
            build_ci/test-results/
            build_ci/Testing/Temporary/
            build_ci/meta-integration/**/*.log
            build_ci/meta-integration/**/*.json
            /mnt/dev/lavik-*.log
            /mnt/dev/cluster_client_*/**/*.log
            /tmp/lavik-*/**/*.log
            /tmp/cluster_create_*/**/*.log
            /tmp/cluster_client_*/**/*.log
            /tmp/meta_*/**/*.log
            /tmp/lavik-*.log
          if-no-files-found: ignore
          retention-days: 7

  test-shard-arm64:
    name: Test shard (${{ matrix.platform.arch }}, ${{ matrix.shard }})
    needs: build-arm64
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform:
          - arch: arm64
            runner: ubuntu-24.04-arm
        shard: [0, 1, 2, 3, 4, 5]
    env: *shard-env
    steps: *shard-steps

  monitoring-config:
    name: Monitoring config and rules
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: scripts/install_monitoring_tools.sh "$RUNNER_TEMP/monitoring-tools"
      - run: python3 scripts/check_monitoring.py --tools "$RUNNER_TEMP/monitoring-tools"
      - run: python3 -m unittest discover -s tests -p test_monitoring_config.py
      - name: Check deployment modes without notification credentials
        working-directory: deploy/monitoring
        run: |
          LAVIK_TARGETS=data:9100 LAVIK_META_TARGETS=meta:9200 docker compose config --quiet
          LAVIK_TARGETS=data:9100 ALERTMANAGER_TARGETS=alertmanager:9093 docker compose --profile alertmanager config --quiet
          LAVIK_TARGETS=data:9100 ALERTMANAGER_TARGETS=external:9093 docker compose config --quiet

  monitoring-e2e:
    name: Monitoring notification drill (amd64)
    needs: build-amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: scripts/install_monitoring_tools.sh "$RUNNER_TEMP/monitoring-tools"
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd libssl3t64
          sudo sysctl -w kernel.io_uring_disabled=0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-build-amd64
          path: ${{ runner.temp }}/ci-build
      - name: Restore test runtime
        run: |
          tar --zstd -xf "$RUNNER_TEMP/ci-build/ci-build.tar.zst"
          python3 scripts/ci_build_bundle.py validate build_ci
      - name: Verify real firing and resolved delivery
        run: python3 tests/monitoring/e2e.py --tools "$RUNNER_TEMP/monitoring-tools" --output "$RUNNER_TEMP/monitoring-drill" --lavik-bin build_ci/lavik --meta-bin build_ci/lavik-meta
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: monitoring-notification-evidence
          path: |
            ${{ runner.temp }}/monitoring-drill/*.log
            ${{ runner.temp }}/monitoring-drill/*.json
            ${{ runner.temp }}/monitoring-drill/*.jsonl
          retention-days: 7

  # Preserve branch-protection check names and reject incomplete work within
  # each architecture, without waiting for or inheriting the other's result.
  test-amd64:
    name: Tests (amd64)
    if: ${{ always() }}
    needs: [build-amd64, test-shard-amd64, admin-amd64, monitoring-config, monitoring-e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BUILD_RESULT: ${{ needs.build-amd64.result }}
      SHARD_RESULT: ${{ needs.test-shard-amd64.result }}
      ADMIN_RESULT: ${{ needs.admin-amd64.result }}
      MONITORING_CONFIG_RESULT: ${{ needs.monitoring-config.result }}
      MONITORING_E2E_RESULT: ${{ needs.monitoring-e2e.result }}
    steps: &gate-steps
      - name: Require all architecture tests
        run: |
          test "$BUILD_RESULT" = success
          test "$SHARD_RESULT" = success
          test "$ADMIN_RESULT" = success
          test "${MONITORING_CONFIG_RESULT:-success}" = success
          test "${MONITORING_E2E_RESULT:-success}" = success

  test-arm64:
    name: Tests (arm64)
    if: ${{ always() }}
    needs: [build-arm64, test-shard-arm64, admin-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BUILD_RESULT: ${{ needs.build-arm64.result }}
      SHARD_RESULT: ${{ needs.test-shard-arm64.result }}
      ADMIN_RESULT: ${{ needs.admin-arm64.result }}
    steps: *gate-steps
