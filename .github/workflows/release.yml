name: Ubuntu release packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Let an active publication finish; newer pushes replace the pending run.
  cancel-in-progress: false

jobs:
  package:
    name: Ubuntu 24.04 / ${{ matrix.arch }} / ${{ matrix.variant }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            variant: minimal
            suffix: '-minimal'
            bypass: 'OFF'
          - arch: x86_64
            runner: ubuntu-24.04
            variant: standard
            suffix: ''
            bypass: 'ON'
          - arch: aarch64
            runner: ubuntu-24.04-arm
            variant: minimal
            suffix: '-minimal'
            bypass: 'OFF'
          - arch: aarch64
            runner: ubuntu-24.04-arm
            variant: standard
            suffix: ''
            bypass: 'ON'
    env:
      CC: gcc-13
      CXX: g++-13
      # Limit peak memory during compilation and LTO on hosted runners.
      LAVIK_PACKAGE_JOBS: '2'
      LAVIK_PACKAGE_KERNEL_BYPASS: ${{ matrix.bypass }}
      LAVIK_PACKAGE_VERSION: nightly
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Initialize pinned dependencies
        run: |
          git submodule update --init bycorf third_party/mimalloc third_party/nuraft
          git -C third_party/nuraft submodule update --init asio
          git -C bycorf submodule update --init third_party/liburing third_party/abseil

      - name: Initialize bypass dependencies
        if: matrix.bypass == 'ON'
        run: |
          git -C bycorf submodule update --init third_party/spdk third_party/dpdk
          git -C bycorf/third_party/spdk submodule update --init isa-l isa-l-crypto

      - name: Install build dependencies
        run: |
          args=()
          if [[ "$LAVIK_PACKAGE_KERNEL_BYPASS" == ON ]]; then
            args+=(--with-bypass)
          fi
          ./scripts/install_build_deps.sh "${args[@]}"

      - name: Verify SPDK code generation dependencies
        if: matrix.bypass == 'ON'
        # Run the same generator as SPDK's include/Makefile before CMake starts
        # building dependencies; runner images do not guarantee these modules.
        run: |
          bycorf/third_party/spdk/scripts/genrpc.py \
            --schema bycorf/third_party/spdk/schema/schema.json --rpcs \
            > "$RUNNER_TEMP/spdk-rpc-autogen.h"
          test -s "$RUNNER_TEMP/spdk-rpc-autogen.h"

      - name: Build and verify release package
        run: ./scripts/package_release.sh

      - name: Verify archived executables
        run: |
          cd dist
          sha256sum --check ./*.sha256
          mkdir unpacked
          tar -xzf ./*.tar.gz -C unpacked
          package_dir=$(find unpacked -mindepth 1 -maxdepth 1 -type d)
          for notice in LICENSE NOTICE OPENSSL-LICENSE.txt; do
            test -s "$package_dir/$notice"
          done
          test "$(cat "$package_dir/REVISION")" = "$GITHUB_SHA"
          for app in lavik lavik-meta lavik-ctl; do
            binary=$(find unpacked -type f -name "$app")
            test -n "$binary"
            "$binary" --help >/dev/null 2>&1
            "$binary" --version
          done
          smoke_args=()
          if [[ "$LAVIK_PACKAGE_KERNEL_BYPASS" == OFF ]]; then
            smoke_args+=(--expect-no-bypass)
          fi
          python3 ../tests/runtime_backends_smoke.py "$package_dir/lavik" "${smoke_args[@]}"

      - name: Upload release package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: lavik-ubuntu-24.04-${{ matrix.arch }}${{ matrix.suffix }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  nightly:
    name: Update nightly release
    needs: package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: lavik-ubuntu-24.04-*
          path: dist
          merge-multiple: true

      - name: Publish complete nightly set
        run: |
          # A queued/manual run of an older commit must not replace newer main.
          main_sha=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            echo 'Main has advanced; keeping the previous nightly until its replacement is ready.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          cd dist
          assets=()
          for arch in x86_64 aarch64; do
            for suffix in '' '-minimal'; do
              archive="lavik-nightly-linux-$arch$suffix.tar.gz"
              test -s "$archive"
              test -s "$archive.sha256"
              sha256sum --check "$archive.sha256"
              assets+=("$archive" "$archive.sha256")
            done
          done

          cat > notes.md <<'EOF'
          Automated Ubuntu 24.04 / GCC 13 build of main.

          All packages include lavik, lavik-meta, lavik-ctl, LICENSE and notices.
          - Standard: DPDK/SPDK included; x86-64-v2 or ARMv8-A+CRC32 required.
          - Minimal: kernel TCP/io_uring only; compiler-default CPU target.

          Both variants require Linux 6.1+ with io_uring enabled for lavik and
          lavik-meta, including DPDK/SPDK deployments, and Ubuntu 24.04-compatible glibc.

          These prerelease assets are replaced after successful main builds.
          EOF
          printf '\nSource: [%s](https://github.com/%s/commit/%s)\n' \
            "$GITHUB_SHA" "$GH_REPO" "$GITHUB_SHA" >> notes.md
          printf '\n[Hardware and platform requirements](https://github.com/%s/blob/%s/README.md#release-hardware-and-platform-requirements)\n' \
            "$GH_REPO" "$GITHUB_SHA" >> notes.md

          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly "${assets[@]}" --clobber
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/nightly" \
              -f sha="$GITHUB_SHA" -F force=true
            gh release edit nightly --title 'Nightly (main)' --prerelease \
              --latest=false --notes-file notes.md
          else
            # Recover a tag left behind by an interrupted first publication.
            if gh api "repos/$GH_REPO/git/ref/tags/nightly" >/dev/null 2>&1; then
              gh api --method PATCH "repos/$GH_REPO/git/refs/tags/nightly" \
                -f sha="$GITHUB_SHA" -F force=true
            fi
            gh release create nightly "${assets[@]}" --target "$GITHUB_SHA" \
              --title 'Nightly (main)' --prerelease --latest=false --notes-file notes.md
          fi
