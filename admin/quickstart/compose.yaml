name: lavik-admin-quickstart

# All services share a checksummed release retained in a Docker volume.
# The image contains runtime OS tools only; download.sh installs Lavik and Node.
x-runtime: &runtime
  image: lavik-admin-quickstart:runtime
  build: .

x-node: &node
  <<: *runtime
  init: true
  entrypoint: [sh, /quickstart/start.sh]
  security_opt: [seccomp=unconfined]
  restart: unless-stopped
  stop_grace_period: 30s

services:
  download:
    <<: *runtime
    profiles: [tools]
    entrypoint: [bash, /quickstart/download.sh]
    volumes:
      - .:/quickstart:ro
      - release:/release
      # Inspect existing state before assigning a first release; never modify it.
      - admin:/existing/admin:ro
      - meta-1:/existing/meta-1:ro
      - meta-2:/existing/meta-2:ro
      - meta-3:/existing/meta-3:ro
      - data-1:/existing/data-1:ro
      - data-2:/existing/data-2:ro
      - data-3:/existing/data-3:ro
    environment:
      LAVIK_QUICKSTART_VERSION: ${LAVIK_QUICKSTART_VERSION:-nightly}

  meta-1:
    <<: *node
    command: [meta, "1"]
    volumes: [".:/quickstart:ro", "release:/release:ro", "meta-1:/data"]
    networks:
      cluster: { ipv4_address: 172.29.91.11 }
  meta-2:
    <<: *node
    command: [meta, "2"]
    volumes: [".:/quickstart:ro", "release:/release:ro", "meta-2:/data"]
    networks:
      cluster: { ipv4_address: 172.29.91.12 }
  meta-3:
    <<: *node
    command: [meta, "3"]
    volumes: [".:/quickstart:ro", "release:/release:ro", "meta-3:/data"]
    networks:
      cluster: { ipv4_address: 172.29.91.13 }

  data-1:
    <<: *node
    command: [data, "1"]
    volumes: [".:/quickstart:ro", "release:/release:ro", "data-1:/data"]
    ports: ["127.0.0.1:16379:6379"]
    networks:
      cluster: { ipv4_address: 172.29.91.21 }
  data-2:
    <<: *node
    command: [data, "2"]
    volumes: [".:/quickstart:ro", "release:/release:ro", "data-2:/data"]
    ports: ["127.0.0.1:16380:6379"]
    networks:
      cluster: { ipv4_address: 172.29.91.22 }
  data-3:
    <<: *node
    command: [data, "3"]
    volumes: [".:/quickstart:ro", "release:/release:ro", "data-3:/data"]
    ports: ["127.0.0.1:16381:6379"]
    networks:
      cluster: { ipv4_address: 172.29.91.23 }

  admin:
    <<: *runtime
    init: true
    working_dir: /admin
    command: [node, server.mjs]
    restart: unless-stopped
    volumes: ["..:/admin:ro", "release:/release:ro", "admin:/data"]
    environment:
      LAVIK_CTL: /release/current/lavik-ctl
      LAVIK_ADMIN_DATA: /data/lavik-admin
      LAVIK_ADMIN_BIND: 0.0.0.0
      LAVIK_ADMIN_ORIGIN: http://localhost:${LAVIK_QUICKSTART_PORT:-4173}
    ports: ["127.0.0.1:${LAVIK_QUICKSTART_PORT:-4173}:4173"]
    networks:
      cluster: { ipv4_address: 172.29.91.10 }

# Lavik advertises numeric endpoints, so every participant must see the same
# stable IPs. Host ports provide direct node access; cluster redirects still
# name these internal IPs. Run redis-cli -c inside Docker to follow them.
networks:
  cluster:
    ipam:
      config: [{ subnet: 172.29.91.0/24 }]

volumes:
  release:
  admin:
  meta-1:
  meta-2:
  meta-3:
  data-1:
  data-2:
  data-3:
